          <h1>Constantin Chabirand</h1>
          <p>
            <strong>Embedded Software Engineer &amp; Architect</strong> — real-time firmware,
            multicore SoCs, safety &amp; cybersecurity, AI-augmented — now hands-on in coherent
            optical communications. Munich, Germany. Open to relocating to the USA
            (J-1 Research Scholar or Specialist via Cultural Vistas / IREX, or H-1B).
          </p>
          <h2>Summary</h2>
          <ul>
            <li>9 years shipping production firmware: real-time control, DSP, multicore ARM, bare-metal, functional safety to ASIL-D. ECUs in production vehicles for Mercedes-Benz, VW, BMW, Tesla, Continental.</li>
            <li>Founded and scaled an embedded engineering practice from 1 to 60+ engineers (€11.2M annual revenue); founded the AUTOSAR Academy; Vector CEP certified.</li>
            <li>Hands-on in coherent optical communications: DARPA Space-BACN (sole firmware engineer, free-space optical terminal) and ESA Pegasus (coherent-DWDM transport — WSS, superchannels, OSNR/BER, up to 400G). Owns on-MCU DSP and microsecond control loops: blind polarization control, runtime-reconfigurable FIR demod, DDS pilot tones.</li>
            <li>Why automotive → optics: eight years of ASIL-D discipline (formal timing budgets, deterministic scheduling, first-time-right bring-up) applied to coherent optical links that must never drop lock.</li>
            <li>AI-augmented builder: multi-model orchestration (PowerSpawn) and self-built tooling (Radeau), ~3–5× delivery velocity.</li>
          </ul>
          <h2>Core competencies</h2>
          <p>
            Embedded C, ARM (Cortex-M/R), AURIX multicore, bare-metal firmware, RTOS, on-MCU DSP,
            coherent DWDM (100–400G), OSNR/BER characterization, high-speed SerDes, ISO 26262 / ASIL-D,
            HSM / Secure Boot / SecOC, AUTOSAR Classic &amp; Adaptive, Lauterbach TRACE32, Python automation, AI-augmented development.
          </p>
